  <canvas id="canvas" width="400" height="400"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const g = canvas.getContext('2d');
    const radius = (canvas.height / 2) * 0.9;

    function drawClock() {
      g.save();
      g.clearRect(0, 0, canvas.width, canvas.height);
      g.translate(canvas.width / 2, canvas.height / 2); // 原點 → 鐘心
      drawFace();
      drawText();
      drawTime();
      g.restore();
    }

    function drawFace() {
      // 外圈
      g.beginPath();
      g.arc(0, 0, radius, 0, 2 * Math.PI);
      g.fillStyle = 'white';
      g.fill();

      //   當 strokeStyle、lineWidth = radius * 0.1，再 stroke() 做出金屬外框

      // 中心點
      g.beginPath();
      g.arc(0, 0, radius * 0.05, 0, 2 * Math.PI);
      g.fillStyle = '#333';
      g.fill();
    }

    function drawText() {
      g.font = radius * 0.15 + 'px arial';
